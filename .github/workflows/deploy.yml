name: Deploy production VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-gen-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to pocgen.daimooma.com
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
      DOMAIN: pocgen.daimooma.com
      APP_DIR: /var/www/poc-gen
      APP_NAME: poc-gen
      APP_PORT: "3010"

    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            VPS_HOST \
            VPS_USER \
            VPS_SSH_PORT \
            VPS_SSH_PRIVATE_KEY \
            PRODUCTION_ENV_FILE \
            LETSENCRYPT_EMAIL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Prepare SSH and production environment
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/poc_gen_deploy"
          chmod 600 "$HOME/.ssh/poc_gen_deploy"

          if [[ -n "${VPS_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            echo "::warning::VPS_KNOWN_HOSTS is unset; trusting the host key returned on this first connection."
            ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$PRODUCTION_ENV_FILE" > /tmp/poc-gen.env.production
          chmod 600 /tmp/poc-gen.env.production

      - name: Transfer deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_options=(
            -i "$HOME/.ssh/poc_gen_deploy"
            -p "$VPS_SSH_PORT"
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          scp_options=(
            -i "$HOME/.ssh/poc_gen_deploy"
            -P "$VPS_SSH_PORT"
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          connected=false
          for attempt in 1 2 3 4; do
            if ssh "${ssh_options[@]}" \
              "$VPS_USER@$VPS_HOST" \
              'install -d -m 700 /tmp/poc-gen-deploy'; then
              connected=true
              break
            fi

            echo "::warning::SSH connection attempt ${attempt}/4 failed."
            if [[ "$attempt" -lt 4 ]]; then
              sleep $((attempt * 5))
            fi
          done

          if [[ "$connected" != true ]]; then
            echo "::error::Could not reach the VPS over SSH. Check the VPS/provider firewall and SSH service."
            exit 1
          fi

          transferred=false
          for attempt in 1 2 3; do
            if scp "${scp_options[@]}" \
              scripts/deploy-vps.sh \
              /tmp/poc-gen.env.production \
              "$VPS_USER@$VPS_HOST:/tmp/poc-gen-deploy/"; then
              transferred=true
              break
            fi

            echo "::warning::SCP transfer attempt ${attempt}/3 failed."
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          if [[ "$transferred" != true ]]; then
            echo "::error::Connected to the VPS, but could not transfer the deployment files."
            exit 1
          fi

      - name: Deploy application
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/poc_gen_deploy" \
            -p "$VPS_SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "APP_NAME='$APP_NAME' APP_DIR='$APP_DIR' APP_PORT='$APP_PORT' BRANCH='main' DOMAIN='$DOMAIN' EXPECTED_IP='$VPS_HOST' LETSENCRYPT_EMAIL='$LETSENCRYPT_EMAIL' REPO_URL='https://github.com/${{ github.repository }}.git' ENV_FILE_SOURCE='/tmp/poc-gen-deploy/poc-gen.env.production' bash /tmp/poc-gen-deploy/deploy-vps.sh"

      - name: Remove transferred secrets
        if: always()
        shell: bash
        run: |
          if [[ -n "${VPS_HOST:-}" && -n "${VPS_USER:-}" && -n "${VPS_SSH_PORT:-}" && -f "$HOME/.ssh/poc_gen_deploy" ]]; then
            ssh \
              -i "$HOME/.ssh/poc_gen_deploy" \
              -p "$VPS_SSH_PORT" \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=2 \
              "$VPS_USER@$VPS_HOST" \
              'rm -rf /tmp/poc-gen-deploy' 2>/dev/null || true
          fi
          rm -f /tmp/poc-gen.env.production "$HOME/.ssh/poc_gen_deploy"
