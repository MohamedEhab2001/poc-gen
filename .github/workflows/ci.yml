name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimum token permissions: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test (with PostgreSQL), build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: poc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d poc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Two SEPARATE databases: DATABASE_URL drives the migrate step only;
      # destructive integration tests require a distinct, unmistakably-named
      # TEST_DATABASE_URL (the safety gate refuses equal URLs).
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/poc_test
      TEST_DATABASE_URL: postgres://testuser:testpass@localhost:5432/poc_gen_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile-enforced)
        run: npm ci

      - name: Create the dedicated test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE poc_gen_test'

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Synthetic automation smoke (mock/dry-run email only)
        run: npm run automation:smoke -- --database=$TEST_DATABASE_URL
        env:
          OUTREACH_SEND_ENABLED: "false"

      - name: PostgreSQL integration tests (fail if skipped)
        run: |
          npm run test:integration 2>&1 | tee /tmp/pg-tests.log
          if grep -qE "skipped" /tmp/pg-tests.log; then
            echo "::error::PostgreSQL integration tests were skipped — they must run in CI."
            exit 1
          fi

      - name: Whitespace/conflict markers check
        run: git diff --check

      - name: Production build (no network fonts)
        run: npm run build

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (lockfile-enforced)
        run: npm ci
      # Separate step so audit-network flakiness never hides a real result:
      # a failure here is always reported as an audit failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
