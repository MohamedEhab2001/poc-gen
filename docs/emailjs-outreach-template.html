<!DOCTYPE html>
<html lang="en"
      xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light only">
  <title>{{subject}}</title>
  <style>
    .outreach-content p { margin: 0 0 16px 0; }
    .outreach-greeting { font-weight: 600; }
    .outreach-intro { color: #262626; }
    .outreach-message a {
      display: inline-block;
      margin-top: 4px;
      padding: 10px 16px;
      border-radius: 6px;
      background: #1f2937;
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
    }
    .outreach-close { margin-top: 20px !important; }
    .outreach-signature { margin-top: 24px; }
    .outreach-signature p { margin-bottom: 5px; }
    .outreach-signature a { color: #2563eb; text-decoration: underline; }
    .outreach-compliance {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      color: #737373;
      font-size: 12px;
      line-height: 1.5;
    }
    .outreach-compliance p { margin-bottom: 6px; }
    .outreach-compliance a { color: #525252; text-decoration: underline; }
    @media only screen and (max-width: 640px) {
      .email-shell { padding: 20px 18px !important; }
    }
  </style>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#ffffff;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{preview_text}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:620px;">
          <tr>
            <td class="email-shell outreach-content"
                style="padding:32px 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#171717;text-align:left;">
              {{{body_html}}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
